# copy to config.toml and fill in your values — config.toml is git-ignored

[profile]
cv_path = "cv.pdf"          # path to your CV (PDF or .md)
goals = """
I'm looking for a senior software engineering role in a product company.
I care about good engineering culture, autonomy, and interesting technical problems.
Dealbreakers: no fully-remote options, consulting/agency work, pure infra/SRE.
Nice-to-haves: Python or TypeScript stack, series B+ startup or established tech company.
"""

[ai]
# Each model slot is "provider:model" — mix and match freely, e.g. route bulk
# scoring direct to a provider's free tier and deep/prep through a gateway.
# No prefix defaults to "openrouter" (bare slugs from older configs still work).
# Supported providers and the env var each resolves its key from (see
# jobscout/llm.py PROVIDERS): openrouter -> OPEN_ROUTER_API_KEY, requesty ->
# REQUESTY_API_KEY, google -> GEMINI_API_KEY, anthropic -> ANTHROPIC_API_KEY.
# Or override any of them here instead of the environment:
# [ai.api_keys]
# openrouter = ""
# bulk_model runs on every listing, so keep it cheap; deep/prep can be stronger.
# Examples: "google:gemini-3.1-flash-lite" (direct, free tier),
#   "openrouter:anthropic/claude-haiku-4-5", "requesty:google/gemini-3.5-flash"
bulk_model = "openrouter:anthropic/claude-haiku-4-5"
deep_model = "openrouter:anthropic/claude-sonnet-4-6"
prep_model = "openrouter:anthropic/claude-sonnet-4-6"
# Which producer scores listings:
#   "additive" (default) — the LLM judges a single 0-100 fit score.
#   "gated"              — the LLM only extracts facts; Python decides apply/no from
#                          your [[gates]] and ranks the apply set from [priority].
#                          fit_score is still written (derived) so Notion/CLI keep working.
# scorer = "gated"
# scorer_repeats = 3         # gated only: extract N times per listing and take the
#                            # majority decision (self-consistency). >1 buys stability.
# scorer_concurrency = 4     # how many listings to score at once in a batch (scan /
#                            # rescore). Peak in-flight requests ~= concurrency *
#                            # (scorer_repeats // 2 + 1); keep modest vs rate limits. 1 = serial.
fit_threshold = 70          # push to Notion when fit >= this
# Optional reasoning effort for the bulk model. Omit for the provider default,
# or set it (providers with no reasoning support ignore this):
# bulk_reasoning_effort = "low"   # low / medium / high / max / min / none

[notion]
token = ""                  # your Notion integration token
database_id = ""            # the board database ID (created by `jobscout init`)

[store]
db_path = "jobscout.db"

# --- scoring ---
# Tune how listings are scored. Everything else about what you want comes from
# your CV + goals (the profile); this section holds the hard numbers.
[scoring]
# salary_floor: omit to ignore compensation entirely. currency is just wording.
# salary_floor = 100000
# salary_currency = "$"
# max_office_days: omit to ignore location/remote policy. Set to e.g. 2 to treat
# roles requiring more than 2 office days/week as a hard negative.
# max_office_days = 3
# specialist_domain_ceiling: cap the score for roles needing specialist domain
# knowledge you lack. 100 = no cap (default).
# specialist_domain_ceiling = 100

# Max points each dimension can add/subtract. Defaults shown — uncomment to retune.
# [scoring.weights]
# title = 20        # match to your target job titles
# scope = 20        # responsibility / seniority / autonomy fit
# company = 15      # size, stage, and type of company
# stack = 10        # how well required skills/tools match yours
# domain = 10       # penalty when the industry needs specialist knowledge
# salary = 3        # penalty when pay is unstated
# office = 3        # penalty when at your office-day limit
# dealbreakers = 50 # penalty when a stated dealbreaker is confirmed

# --- gated assessment (used when ai.scorer = "gated") ---
# Gates are hard eligibility vetoes: any failed gate => decision = "no", no matter
# how good everything else is. Two forms:
#
#   Structured — a predicate over a canonical extracted feature. Features the LLM
#   always extracts (see jobscout/features.py): role_substance, office_days_per_week,
#   salary_gbp, industry. Language/stack vetoes use natural-language rules (e.g.
#   no_blocked_stack), not a structured feature.
#   Ops: <= >= == != in not_in contains.
#
#   Natural-language — anything the schema can't express, as a "Reject only if …"
#   rule the LLM answers pass/fail/unknown with evidence.
#
# on_unknown says what to do when the listing doesn't state the fact (or the model
# isn't confident): "pass" = benefit of the doubt, "fail" = reject,
# "pass_flag" = pass but flag the uncertainty (feeds the priority penalty).
# A gate can only hard-fail on a high-confidence detection (min_confidence, default 0.7).
#
# [[gates]]
# name = "office"
# feature = "office_days_per_week"
# op = "<="
# value = 3
# on_unknown = "pass"
#
# [[gates]]
# name = "salary_floor"
# feature = "salary_gbp"
# op = ">="
# value = 110000
# on_unknown = "pass"
#
# [[gates]]
# name = "no_agency"
# rule = "Reject only if the EMPLOYER's own business is consulting/agency/outsourcing work with no product of its own. A listing posted by a recruiter on behalf of a client is NOT agency work — judge the employer, not the poster."
# on_unknown = "pass"

# Priority tiers rank the apply set (which to do first). A listing lands in the
# earliest tier whose titles match its title OR whose substances match its
# extracted role_substance (substance beats title — a Staff-titled founding role
# lands in your founding tier). unknown_penalty demotes a listing within its tier
# (and trims the derived fit) for every gate that couldn't be verified.
#
# [[priority.tiers]]
# name = "T1"
# titles = ["VP of Engineering", "Head of Engineering"]
# substances = ["leadership"]
#
# [[priority.tiers]]
# name = "T2"
# titles = ["Founding Engineer"]
# substances = ["founding"]
#
# [priority]
# unknown_penalty = 2

# --- sources ---
# Each [[sources]] entry defines one job board / feed to scrape.
# type = "http" | "feed" | "browser". See docs/sources.md for the full guide.

[[sources]]
name = "Hacker News Who's Hiring"
type = "feed"
url = "https://hnrss.org/whoishiring"
enabled = true

# Example real HTTP board — CSS selectors target a job-listing page. Edit the
# search URL and selectors for the board and role you want. See docs/sources.md.
[[sources]]
name = "Built In London – search"
type = "http"
url = "https://www.builtinlondon.uk/jobs?search=your+role+here"
enabled = false
selectors.container = "div[data-id='job-card']"
selectors.title = "a[data-id='job-card-title']"
selectors.company = "a[data-id='company-title'] span"
selectors.url = "a[data-id='job-card-title']"
selectors.location = "span.font-barlow.text-gray-04"
selectors.description = ".bounded-attribute-section"
selectors.fetch_detail = true

# Example LinkedIn source — uses the public guest job-search endpoint (no login).
# Put your title in keywords= and your location in location= (URL-encoded).
# f_TPR=r604800 = posted in the last 7 days. The endpoint returns ~10 results per
# page, so pages=3 fetches the top 30 (start=0,10,20). LinkedIn rate-limits:
# keep pages low if you see 429s. See docs/sources.md.
[[sources]]
name = "LinkedIn – search (London)"
type = "http"
url = "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=your+role+here&location=London%2C%20England%2C%20United%20Kingdom&f_TPR=r604800&start=0"
enabled = false
pages = 3
page_param = "start"
page_size = 10
selectors.container = "li"
selectors.title = "h3.base-search-card__title"
selectors.company = "h4.base-search-card__subtitle a"
selectors.location = "span.job-search-card__location"
selectors.url = "a.base-card__full-link"
selectors.fetch_detail = true

[[sources]]
name = "Example HTTP board"
type = "http"
url = "https://example.com/jobs"
enabled = false
# CSS selectors for the listing container and fields
selectors.container = "div.job-card"
selectors.title = "h2.job-title"
selectors.company = "span.company"
selectors.location = "span.location"
selectors.url = "a.job-link"
selectors.description = "div.description"

[[sources]]
name = "Example login-required board"
type = "browser"
url = "https://example.com/jobs"
enabled = false
login_url = "https://example.com/login"
# credentials from env vars to avoid storing in config
username_env = "EXAMPLE_USERNAME"
password_env = "EXAMPLE_PASSWORD"
selectors.container = "div.job-card"
selectors.title = "h2.title"
selectors.company = "span.company"
selectors.location = "span.location"
selectors.url = "a[href]"
selectors.description = "div.body"
