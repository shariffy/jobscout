[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscout"]

[project]
name = "jobscout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.50.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "feedparser>=6.0.0",
    "pypdf>=5.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
jobscout = "jobscout.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt strings, SQL, Rich markup, and typer help text contain intentionally
# long lines that cannot be broken without altering content or readability.
"jobscout/assess.py" = ["E501"]
"jobscout/prep.py" = ["E501"]
"jobscout/store.py" = ["E501"]
"jobscout/cli.py" = ["E501"]
"jobscout/models.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
